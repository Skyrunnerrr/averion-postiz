worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    absolute_redirect off;

    server {
        listen 5000;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; frame-ancestors 'none'" always;

        location = /integrations/social/facebook {
            limit_except GET HEAD { deny all; }
            root /averion/www;
            default_type text/html;
            try_files /callback.html =403;
        }

        location = /integrations/social/instagram {
            limit_except GET HEAD { deny all; }
            root /averion/www;
            default_type text/html;
            try_files /callback.html =403;
        }

        location = /integrations/social/instagram-standalone {
            limit_except GET HEAD { deny all; }
            root /averion/www;
            default_type text/html;
            try_files /callback.html =403;
        }

        location = /integrations/social/threads {
            limit_except GET HEAD { deny all; }
            root /averion/www;
            default_type text/html;
            try_files /callback.html =403;
        }

        location / {
            return 403;
        }
    }

    server {
        listen 15021;
        server_name _;

        location = /healthz {
            limit_except GET HEAD { deny all; }
            default_type application/json;
            return 200 '{"status":"ready","profile":"averion-provider"}';
        }

        location / {
            return 403;
        }
    }
}
